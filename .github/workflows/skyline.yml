name: GitHub Profile Visuals

on:
  schedule:
    # 03:00 in Malaysia (UTC+8)
    - cron: "0 19 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - README.md
      - assets/**
      - .github/profile-3d-settings.json
      - .github/scripts/**
      - .github/workflows/skyline.yml

permissions:
  contents: write

concurrency:
  group: profile-visuals
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build contribution signal
        env:
          GITHUB_USERNAME: ${{ github.repository_owner }}
        run: node .github/scripts/generate-contribution-signal.mjs

      - name: Build contribution skyline
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: .github/profile-3d-settings.json

      - name: Commit refreshed visuals
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/contribution-signal.svg profile-3d-contrib/profile-night-view.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: refresh profile visuals"
          git push
